name: Publish Jekyll learning site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
env:
  # This upstream revision is also part of the immutable WASM cache keys.
  COMPILER_SOURCE_SHA: e07376cb38bbebdb38fe8821666509e46906e2bf
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout learning site
        uses: actions/checkout@v5
      # The two WASM outputs are versioned independently. Editing Markdown, CSS,
      # quiz data or the shared editor JavaScript does not invalidate them.
      - name: Restore C# 13 / .NET 9 WebAssembly compiler
        id: wasm9
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/compiler-net9/wwwroot
            ${{ runner.temp }}/compiler-net9/LICENSE.txt
          key: wasm-${{ runner.os }}-net9-v1-${{ env.COMPILER_SOURCE_SHA }}-${{ hashFiles('_browser/prepare_compiler.py', '_browser/lesson001-program.cs') }}
      - name: Restore C# 14 / .NET 10 WebAssembly compiler
        id: wasm10
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/compiler-net10/wwwroot
            ${{ runner.temp }}/compiler-net10/LICENSE.txt
          key: wasm-${{ runner.os }}-net10-v1-${{ env.COMPILER_SOURCE_SHA }}-${{ hashFiles('_browser/prepare_compiler.py', '_browser/lesson002-program.cs') }}
      - name: Checkout pinned C# compiler source (only when a cache misses)
        if: steps.wasm9.outputs.cache-hit != 'true' || steps.wasm10.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: MicrosoftLearning/c-sharp-minor
          ref: ${{ env.COMPILER_SOURCE_SHA }}
          path: _compiler_src
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check editor JavaScript syntax
        run: |
          node --check assets/js/compiler-editor.js
          node --check assets/js/course-runner.js
          node --check assets/js/practice-tests.js
          node --check _browser/verify_practice_assertions.cjs
          node --check assets/js/browser-snippets-lesson002.js
          node --check assets/js/browser-snippets-memory001.js
          node --check assets/js/quiz.js
          node --check assets/js/site.js
      - name: Verify lesson C# examples on .NET 9 and .NET 10
        run: |
          dotnet new console -n Lesson001Smoke -f net9.0 -o "$RUNNER_TEMP/lesson001smoke"
          cp _browser/lesson001-program.cs "$RUNNER_TEMP/lesson001smoke/Program.cs"
          dotnet run --project "$RUNNER_TEMP/lesson001smoke" > "$RUNNER_TEMP/lesson001-output.txt"
          printf 'HTTP methods\nGET: 3\nPOST: 2\nPUT: 1\nSum = 60\n' > "$RUNNER_TEMP/lesson001-expected.txt"
          diff -u "$RUNNER_TEMP/lesson001-expected.txt" "$RUNNER_TEMP/lesson001-output.txt"
          node _browser/verify_snippets.cjs "$RUNNER_TEMP/lesson001smoke"
          dotnet new console -n Lesson002Smoke -f net10.0 -o "$RUNNER_TEMP/lesson002smoke"
          cp _browser/lesson002-program.cs "$RUNNER_TEMP/lesson002smoke/Program.cs"
          dotnet build "$RUNNER_TEMP/lesson002smoke"
          dotnet run --no-build --project "$RUNNER_TEMP/lesson002smoke" > "$RUNNER_TEMP/lesson002-output.txt"
          printf '/health: Count=1, TotalMs=5\n/orders: Count=4, TotalMs=220\nBuilds when null: 0\nBuilds when present: 1\nAudit: /health=1/5; /orders=4/220\n' > "$RUNNER_TEMP/lesson002-expected.txt"
          diff -u "$RUNNER_TEMP/lesson002-expected.txt" "$RUNNER_TEMP/lesson002-output.txt"
          node _browser/verify_snippets_lesson2.cjs "$RUNNER_TEMP/lesson002smoke"
          dotnet new console -n Memory001Smoke -f net10.0 -o "$RUNNER_TEMP/memory001smoke"
          cp _browser/memory-lesson001-program.cs "$RUNNER_TEMP/memory001smoke/Program.cs"
          dotnet run --project "$RUNNER_TEMP/memory001smoke" > "$RUNNER_TEMP/memory001-output.txt"
          printf 'Paid orders: 2\nFirst amount: 1499.90\nAfter copy change: 1499.90\n' > "$RUNNER_TEMP/memory001-expected.txt"
          diff -u "$RUNNER_TEMP/memory001-expected.txt" "$RUNNER_TEMP/memory001-output.txt"
          node -e "const p=require('./assets/js/browser-snippets-memory001.js'); if(p.exampleCount!==1) process.exit(1)"
          node -e "const f=require('fs');if(!f.readFileSync('_memory_lessons/001-allocations-copies-retention.md','utf8').includes(f.readFileSync('_browser/memory-lesson001-program.cs','utf8').trim())) process.exit(1)"
      - name: Compile practice Assert harnesses and reject intentionally wrong solutions
        run: |
          for task in task001 task002 alloc001; do
            framework=net10.0
            if test "$task" = task001; then framework=net9.0; fi
            dotnet new console -n "Practice_${task}" -f "$framework" -o "$RUNNER_TEMP/practice/$task"
          done
          node _browser/verify_practice_assertions.cjs "$RUNNER_TEMP/practice"
          for task in task001 task002 alloc001; do
            folder="$RUNNER_TEMP/practice/$task"
            dotnet build "$folder" --no-restore
            if dotnet run --no-build --project "$folder" > "$folder/run.log" 2>&1; then
              echo "ERROR: intentionally wrong $task solution passed its assertions"
              exit 1
            fi
            grep -q "TASK-001:" "$folder/run.log" || {
              if test "$task" != task001; then
                grep -q "TASK-002:" "$folder/run.log" || grep -q "ALLOC-TASK-001:" "$folder/run.log" || {
                  cat "$folder/run.log"
                  exit 1
                }
              else
                cat "$folder/run.log"
                exit 1
              fi
            }
            echo "$task: invalid solution correctly rejected"
          done
      - name: Prepare C# 13 browser compiler (cache miss)
        if: steps.wasm9.outputs.cache-hit != 'true'
        run: |
          cp -a _compiler_src _compiler_src_net9
          python3 _browser/prepare_compiler.py 9 _compiler_src_net9/CSharpCompilerWasm
      - name: Prepare C# 14 browser compiler (cache miss)
        if: steps.wasm10.outputs.cache-hit != 'true'
        run: |
          cp -a _compiler_src _compiler_src_net10
          python3 _browser/prepare_compiler.py 10 _compiler_src_net10/CSharpCompilerWasm
      - name: Build C# 13 browser compiler on .NET 9 (cache miss)
        if: steps.wasm9.outputs.cache-hit != 'true'
        run: |
          dotnet publish _compiler_src_net9/CSharpCompilerWasm/CSharpCompilerWasm.csproj --configuration Release --output "$RUNNER_TEMP/compiler-net9"
          cp _compiler_src_net9/LICENSE "$RUNNER_TEMP/compiler-net9/LICENSE.txt"
      - name: Build C# 14 browser compiler on .NET 10 (cache miss)
        if: steps.wasm10.outputs.cache-hit != 'true'
        run: |
          dotnet publish _compiler_src_net10/CSharpCompilerWasm/CSharpCompilerWasm.csproj --configuration Release --output "$RUNNER_TEMP/compiler-net10"
          cp _compiler_src/LICENSE "$RUNNER_TEMP/compiler-net10/LICENSE.txt"
      - name: Restore pinned CodeMirror assets
        id: codemirror
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/cm/node_modules/codemirror
          key: codemirror-${{ runner.os }}-5.65.21-v1
      - name: Install CodeMirror editor assets (cache miss)
        if: steps.codemirror.outputs.cache-hit != 'true'
        run: npm install --prefix "$RUNNER_TEMP/cm" --no-save --no-package-lock --no-audit --no-fund codemirror@5.65.21
      - uses: actions/configure-pages@v6
      - name: Set revision for fresh page assets and navigation
        run: |
          printf 'revision: "%s"\n' "$GITHUB_SHA" > _data/build.yml
      - name: Build Jekyll course
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Include two browser compilers and shared CodeMirror
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          for runtime in 9 10; do
            mkdir -p "_site/browser-compiler-net$runtime"
            cp -a "$RUNNER_TEMP/compiler-net$runtime/wwwroot/." "_site/browser-compiler-net$runtime/"
            cp "$RUNNER_TEMP/compiler-net$runtime/LICENSE.txt" "_site/browser-compiler-net$runtime/LICENSE.txt"
            # The compiler shell is cached, but this editor JS changes separately.
            sed -i "s#../assets/js/compiler-editor.js#../assets/js/compiler-editor.js?v=$GITHUB_SHA#g" "_site/browser-compiler-net$runtime/index.html"
            test -s "_site/browser-compiler-net$runtime/index.html"
            test -s "_site/browser-compiler-net$runtime/_framework/blazor.webassembly.js"
          done
          mkdir -p _site/assets/vendor/codemirror/lib
          mkdir -p _site/assets/vendor/codemirror/mode/clike
          mkdir -p _site/assets/vendor/codemirror/addon/hint
          mkdir -p _site/assets/vendor/codemirror/addon/edit
          cp "$RUNNER_TEMP/cm/node_modules/codemirror/lib/codemirror.js" _site/assets/vendor/codemirror/lib/
          cp "$RUNNER_TEMP/cm/node_modules/codemirror/lib/codemirror.css" _site/assets/vendor/codemirror/lib/
          cp "$RUNNER_TEMP/cm/node_modules/codemirror/mode/clike/clike.js" _site/assets/vendor/codemirror/mode/clike/
          cp "$RUNNER_TEMP/cm/node_modules/codemirror/addon/hint/show-hint.js" _site/assets/vendor/codemirror/addon/hint/
          cp "$RUNNER_TEMP/cm/node_modules/codemirror/addon/hint/show-hint.css" _site/assets/vendor/codemirror/addon/hint/
          cp "$RUNNER_TEMP/cm/node_modules/codemirror/addon/edit/matchbrackets.js" _site/assets/vendor/codemirror/addon/edit/
          cp "$RUNNER_TEMP/cm/node_modules/codemirror/addon/edit/closebrackets.js" _site/assets/vendor/codemirror/addon/edit/
          if test -f "$RUNNER_TEMP/cm/node_modules/codemirror/LICENSE"; then cp "$RUNNER_TEMP/cm/node_modules/codemirror/LICENSE" _site/assets/vendor/codemirror/LICENSE.txt; fi
          test -s _site/assets/js/compiler-editor.js
          test -s _site/assets/js/course-runner.js
          test -s _site/assets/js/practice-tests.js
          grep -q 'practice-tests.js' _site/courses/csharp-dotnet-9-11/lessons/001-params-countby/index.html
          grep -q 'practice-tests.js' _site/courses/memory/lessons/001-allocations-copies-retention/index.html
          grep -q 'course-compiler' _site/courses/csharp-dotnet-9-11/lessons/001-params-countby/index.html
          grep -q 'course-compiler' _site/courses/csharp-dotnet-9-11/lessons/002-aggregateby-null-conditional-assignment/index.html
          grep -q 'course-compiler' _site/courses/memory/lessons/001-allocations-copies-retention/index.html
          test -s _site/courses/memory/quiz/index.html
          test -s _site/courses/csharp-dotnet-9-11/quiz/index.html
          test -s _site/courses/memory/index.html
          test -s _site/courses/csharp-dotnet-9-11/index.html
          test -s _site/sw.js
          node --check _site/sw.js
          grep -q 'id="page-editor-run"' _site/courses/csharp-dotnet-9-11/lessons/001-params-countby/index.html
          grep -q 'id="page-editor-run"' _site/courses/memory/lessons/001-allocations-copies-retention/index.html
          grep -q "$GITHUB_SHA" _site/index.html
          grep -q "$GITHUB_SHA" _site/sw.js
          grep -q "$GITHUB_SHA" _site/courses/memory/lessons/001-allocations-copies-retention/index.html
      - uses: actions/upload-pages-artifact@v5
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
