name: Publish Jekyll learning site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
env:
  # This upstream revision is also part of the immutable WASM cache keys.
  COMPILER_SOURCE_SHA: e07376cb38bbebdb38fe8821666509e46906e2bf
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout learning site
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # The WASM outputs are versioned independently. Editing Markdown, CSS,
      # quiz data or the shared editor JavaScript does not invalidate them.
      - name: Restore C# 13 / .NET 9 WebAssembly compiler
        id: wasm9
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/compiler-net9/wwwroot
            ${{ runner.temp }}/compiler-net9/LICENSE.txt
          key: wasm-${{ runner.os }}-net9-v1-${{ env.COMPILER_SOURCE_SHA }}-${{ hashFiles('_browser/prepare_compiler.py') }}
      - name: Restore C# 14 / .NET 10 WebAssembly compiler
        id: wasm10
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/compiler-net10/wwwroot
            ${{ runner.temp }}/compiler-net10/LICENSE.txt
          key: wasm-${{ runner.os }}-net10-v1-${{ env.COMPILER_SOURCE_SHA }}-${{ hashFiles('_browser/prepare_compiler.py') }}
      - name: Restore C# 15 / .NET 11 WebAssembly compiler
        id: wasm11
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/compiler-net11/wwwroot
            ${{ runner.temp }}/compiler-net11/LICENSE.txt
          key: wasm-${{ runner.os }}-net11-v1-${{ env.COMPILER_SOURCE_SHA }}-${{ hashFiles('_browser/prepare_compiler.py') }}
      - name: Checkout pinned C# compiler source (only when a cache misses)
        if: steps.wasm9.outputs.cache-hit != 'true' || steps.wasm10.outputs.cache-hit != 'true' || steps.wasm11.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: MicrosoftLearning/c-sharp-minor
          ref: ${{ env.COMPILER_SOURCE_SHA }}
          path: _compiler_src
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Select lesson C# checks
        id: lesson_checks
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_WASM9: ${{ steps.wasm9.outputs.cache-hit != 'true' }}
          REBUILD_WASM10: ${{ steps.wasm10.outputs.cache-hit != 'true' }}
          REBUILD_WASM11: ${{ steps.wasm11.outputs.cache-hit != 'true' }}
        run: node _browser/select_lesson_checks.cjs
      - uses: actions/setup-dotnet@v5
        if: steps.lesson_checks.outputs.sdk_versions != ''
        with:
          dotnet-version: ${{ steps.lesson_checks.outputs.sdk_versions }}
      - name: Check JavaScript syntax
        run: |
          for script in assets/js/*.js _browser/*.cjs _browser/*.mjs; do
            node --check "$script"
          done
      - name: Verify service worker URL handling
        run: node _browser/verify_service_worker.cjs
      - name: Install pinned FSRS scheduler and bundler
        run: npm install --prefix _browser --no-save --no-package-lock --no-audit --no-fund ts-fsrs@6.0.0 esbuild@0.25.12
      - name: Verify FSRS-7 scheduling with real ts-fsrs and build browser module
        run: |
          node _browser/quiz-fsrs.test.mjs
          _browser/node_modules/.bin/esbuild _browser/quiz-fsrs-entry.mjs --bundle --platform=browser --format=iife --target=es2022 --minify --outfile=assets/js/quiz-fsrs.js
          test -s assets/js/quiz-fsrs.js
          node --check assets/js/quiz-fsrs.js
      - name: Verify authored C# examples and practice
        env:
          SELECTED_LESSONS: ${{ steps.lesson_checks.outputs.lessons }}
        run: |
          node _browser/verify_practice_assertions.cjs
          node _browser/verify_lessons.cjs
      - name: Build browser compilers with a cache miss
        if: steps.lesson_checks.outputs.rebuild_compilers != ''
        env:
          REBUILD_COMPILERS: ${{ steps.lesson_checks.outputs.rebuild_compilers }}
        run: |
          read -r -a runtimes <<< "$REBUILD_COMPILERS"
          for runtime in "${runtimes[@]}"; do
            echo "Preparing and publishing .NET $runtime browser compiler"
            source="_compiler_src_net$runtime"
            output="$RUNNER_TEMP/compiler-net$runtime"
            cp -a _compiler_src "$source"
            python3 _browser/prepare_compiler.py "$runtime" "$source/CSharpCompilerWasm"
            dotnet publish "$source/CSharpCompilerWasm/CSharpCompilerWasm.csproj" --framework "net$runtime.0" --configuration Release --output "$output"
            cp "$source/LICENSE" "$output/LICENSE.txt"
          done
      - name: Restore pinned CodeMirror assets
        id: codemirror
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/cm/node_modules/codemirror
          key: codemirror-${{ runner.os }}-5.65.21-v1
      - name: Install CodeMirror editor assets (cache miss)
        if: steps.codemirror.outputs.cache-hit != 'true'
        run: npm install --prefix "$RUNNER_TEMP/cm" --no-save --no-package-lock --no-audit --no-fund codemirror@5.65.21
      - name: Set revision for fresh page assets and navigation
        run: |
          printf 'revision: "%s"\n' "$GITHUB_SHA" > _data/build.yml
      - name: Build Jekyll course
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Include browser compilers and shared CodeMirror
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          for runtime in 9 10 11; do
            mkdir -p "_site/browser-compiler-net$runtime"
            cp -a "$RUNNER_TEMP/compiler-net$runtime/wwwroot/." "_site/browser-compiler-net$runtime/"
            cp "$RUNNER_TEMP/compiler-net$runtime/LICENSE.txt" "_site/browser-compiler-net$runtime/LICENSE.txt"
            # Stamp only the staged shell so first loads are fresh without invalidating the WASM cache.
            shell="_site/browser-compiler-net$runtime/index.html"
            sed -i 's|src="\.\./assets/js/compiler-editor\.js"|src="../assets/js/compiler-editor.js?v='"$GITHUB_SHA"'"|' "$shell"
            grep -Fq "src=\"../assets/js/compiler-editor.js?v=$GITHUB_SHA\"" "$shell"
            test -s "_site/browser-compiler-net$runtime/_framework/blazor.webassembly.js"
          done
          mkdir -p _site/assets/vendor/codemirror/lib
          mkdir -p _site/assets/vendor/codemirror/mode/clike
          mkdir -p _site/assets/vendor/codemirror/addon/hint
          mkdir -p _site/assets/vendor/codemirror/addon/edit
          cp "$RUNNER_TEMP/cm/node_modules/codemirror/lib/codemirror.js" _site/assets/vendor/codemirror/lib/
          cp "$RUNNER_TEMP/cm/node_modules/codemirror/lib/codemirror.css" _site/assets/vendor/codemirror/lib/
          cp "$RUNNER_TEMP/cm/node_modules/codemirror/mode/clike/clike.js" _site/assets/vendor/codemirror/mode/clike/
          cp "$RUNNER_TEMP/cm/node_modules/codemirror/addon/hint/show-hint.js" _site/assets/vendor/codemirror/addon/hint/
          cp "$RUNNER_TEMP/cm/node_modules/codemirror/addon/hint/show-hint.css" _site/assets/vendor/codemirror/addon/hint/
          cp "$RUNNER_TEMP/cm/node_modules/codemirror/addon/edit/matchbrackets.js" _site/assets/vendor/codemirror/addon/edit/
          cp "$RUNNER_TEMP/cm/node_modules/codemirror/addon/edit/closebrackets.js" _site/assets/vendor/codemirror/addon/edit/
          if test -f "$RUNNER_TEMP/cm/node_modules/codemirror/LICENSE"; then cp "$RUNNER_TEMP/cm/node_modules/codemirror/LICENSE" _site/assets/vendor/codemirror/LICENSE.txt; fi
          for retired in courses/whats-new lessons quiz labs/001-browser; do
            test ! -e "_site/$retired"
          done
          test -s _site/sw.js
          node --check _site/sw.js
          grep -q "$GITHUB_SHA" _site/sw.js
      - name: Verify built pages, quizzes and WASM compilers in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tests" --no-save --no-package-lock --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/browser-tests/node_modules/.bin/playwright" install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/browser-site"
          ln -s "$GITHUB_WORKSPACE/_site" "$RUNNER_TEMP/browser-site/dotnet-courses"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/browser-site" &
          trap 'kill $!' EXIT
          curl -fsS --retry 5 --retry-connrefused http://127.0.0.1:4173/dotnet-courses/ >/dev/null
          export NODE_PATH="$RUNNER_TEMP/browser-tests/node_modules"
          site_url=http://127.0.0.1:4173/dotnet-courses/
          node _browser/verify_site.cjs "$site_url" _site "$GITHUB_SHA"
          node _browser/verify_quiz.cjs "$site_url"
          node _browser/verify_compiler_output.cjs "$site_url" "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
