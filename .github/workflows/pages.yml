name: Publish Jekyll learning site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout learning site
        uses: actions/checkout@v4
      - name: Checkout pinned C# minor sources (MIT license)
        uses: actions/checkout@v4
        with:
          repository: MicrosoftLearning/c-sharp-minor
          ref: e07376cb38bbebdb38fe8821666509e46906e2bf
          path: _compiler_src
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Smoke test lesson 001 C# 13 and CountBy
        run: |
          dotnet new console -n Lesson001Smoke -f net9.0 -o "$RUNNER_TEMP/lesson001smoke"
          cp _browser/lesson001-program.cs "$RUNNER_TEMP/lesson001smoke/Program.cs"
          dotnet run --project "$RUNNER_TEMP/lesson001smoke" > "$RUNNER_TEMP/lesson001-output.txt"
          printf 'HTTP methods\nGET: 3\nPOST: 2\nPUT: 1\nSum = 60\n' > "$RUNNER_TEMP/lesson001-expected.txt"
          diff -u "$RUNNER_TEMP/lesson001-expected.txt" "$RUNNER_TEMP/lesson001-output.txt"
      - name: Adapt browser compiler for lesson 001
        run: python3 _browser/prepare_compiler.py
      - name: Build real C# compiler for WebAssembly
        run: dotnet publish _compiler_src/CSharpCompilerWasm/CSharpCompilerWasm.csproj --configuration Release --output "$RUNNER_TEMP/browser-compiler-publish"
      - uses: actions/configure-pages@v5
      - name: Build Jekyll course
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Include compiled browser runner
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          mkdir -p _site/browser-compiler
          cp -a "$RUNNER_TEMP/browser-compiler-publish/wwwroot/." _site/browser-compiler/
          cp _compiler_src/LICENSE _site/browser-compiler/LICENSE.txt
          test -s _site/browser-compiler/index.html
          test -s _site/browser-compiler/_framework/blazor.webassembly.js
          test -s _site/labs/001-browser/index.html
      - uses: actions/upload-pages-artifact@v4
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
