title: ".NET Courses — C#, память и производительность"
description: "Практические курсы для опытных C#/.NET-разработчиков: возможности C# 13–15, .NET 9–11, память, аллокации и производительность."
lang: ru
url: "https://boyarincev.github.io"
baseurl: "/dotnet-courses"
markdown: kramdown
highlighter: rouge
collections:
  lessons:
    output: true
    permalink: /courses/csharp-dotnet-9-11/lessons/:name/
  memory_lessons:
    output: true
    permalink: /courses/memory/lessons/:name/
defaults:
  - scope:
      path: ""
      type: lessons
    values:
      layout: lesson
      course: whats-new
  - scope:
      path: ""
      type: memory_lessons
    values:
      layout: lesson
      course: memory
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
