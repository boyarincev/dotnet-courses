title: ".NET Courses — C#, производительность и память"
description: "Практические курсы .NET для опытных разработчиков: C# 13–15, .NET 9–11, память, аллокации и производительность."
lang: ru
url: "https://boyarincev.github.io"
baseurl: "/dotnet-courses"
markdown: kramdown
highlighter: rouge
collections:
  lessons:
    output: true
    permalink: /lessons/:name/
defaults:
  - scope:
      path: ""
      type: lessons
    values:
      layout: lesson
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
