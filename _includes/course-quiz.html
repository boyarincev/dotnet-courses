<div class="eyebrow"><a href="{{ include.course_url | relative_url }}">{{ include.course_title }}</a></div>
<h1>Повторение</h1>
<p id="quiz-context" class="muted"></p>
<div id="quiz-lesson-progress" hidden>
  <p role="status"></p>
</div>
<div class="quiz-toolbar">
  <strong id="quiz-count" role="status">Вопросы</strong>
  <div>
    <span id="quiz-next-control" hidden><button type="button" id="quiz-next" class="button">Другая подборка</button></span>
    <button type="button" id="quiz-show-all" class="button">Все вопросы</button>
  </div>
</div>
<section id="quiz-root" aria-label="Вопросы квиза" data-course="{{ include.course_id }}" data-lesson-numbers="{{ include.lessons | map: 'lesson_number' | join: ',' }}"></section>
<div id="quiz-actions" hidden class="quiz-actions">
  <button type="button" id="quiz-copy" class="button primary">Скопировать ответы</button>
  <button type="button" id="quiz-download" class="button">Скачать .txt</button>
</div>
<p id="quiz-feedback" role="status"></p>
<p class="muted">Ответы сохраняются в этом браузере. Их можно отправить на проверку отдельно. Расписание FSRS учитывает твою самооценку.</p>
<details class="quiz-backup">
  <summary>Резервная копия квизов курса</summary>
  <p class="muted">В JSON входят черновики ответов, расписание и история FSRS, отметки о пройденных квизах.</p>
  <div class="quiz-progress-actions">
    <button type="button" id="quiz-export-progress" class="button">Скачать копию (.json)</button>
    <button type="button" id="quiz-import-progress" class="button">Импортировать копию</button>
    <input id="quiz-import-file" type="file" accept="application/json,.json" hidden>
  </div>
  <p id="quiz-backup-feedback" class="muted" role="status"></p>
</details>
<script type="application/json" id="question-bank">{{ include.questions | jsonify }}</script>
<script defer src="{{ '/assets/js/quiz-fsrs.js' | relative_url }}?v={{ site.data.build.revision | default: 'dev' }}"></script>
<script defer src="{{ '/assets/js/quiz.js' | relative_url }}?v={{ site.data.build.revision | default: 'dev' }}"></script>
