<div class="eyebrow"><a href="{{ include.course_url | relative_url }}">{{ include.course_title }}</a></div>
<h1 id="quiz-title">Банк вопросов</h1>
<div class="quiz-toolbar">
  <div id="quiz-filter-control" hidden>
    <label for="quiz-filter">Уроки</label>
    <select id="quiz-filter">
      <option value="completed">Пройденные уроки</option>
      <option value="all">Все уроки</option>
      {% for lesson in include.lessons %}
      <option value="{{ lesson.lesson_number }}">Урок {{ lesson.lesson_number }} · {{ lesson.title | escape }}</option>
      {% endfor %}
    </select>
  </div>
  <strong id="quiz-count" role="status"></strong>
  <a id="quiz-bank-link" href="{{ page.url | relative_url }}" hidden>Банк вопросов</a>
</div>
<section id="quiz-root" aria-label="Вопросы" data-course="{{ include.course_id }}" data-lesson-numbers="{{ include.lessons | map: 'lesson_number' | join: ',' }}"></section>
<section id="quiz-result" class="notice" hidden>
  <h2 tabindex="-1">Ответы сохранены</h2>
  <div class="quiz-actions">
    <button type="button" id="quiz-copy" class="button">Скопировать ответы</button>
    <button type="button" id="quiz-download" class="button">Скачать .txt</button>
    <a id="quiz-next-lesson" class="button primary" href="{{ include.course_url | relative_url }}#course-lessons">К списку уроков</a>
  </div>
</section>
<div id="quiz-navigation" class="quiz-actions" hidden>
  <a id="quiz-back" class="button" href="{{ include.course_url | relative_url }}#course-lessons">К списку уроков</a>
</div>
<p id="quiz-feedback" role="status"></p>
<template id="quiz-lesson-links">
  {% for lesson in include.lessons %}
  <a data-lesson="{{ lesson.lesson_number }}" href="{{ lesson.url | relative_url }}"></a>
  {% endfor %}
</template>
<template id="quiz-question-template">
  <article class="question">
    <div class="question-meta"></div>
    <h2 data-question-title tabindex="-1"></h2>
    <p class="muted" data-question-due hidden></p>
    <label>Твой ответ</label>
    <textarea rows="4" autocomplete="off"></textarea>
    <p class="muted quiz-rating-hint">Сначала введи ответ</p>
    <div class="quiz-rating-actions" role="group" aria-label="Самооценка">
      <button type="button" class="button" data-rating="wrong" disabled>Неверно</button>
      <button type="button" class="button" data-rating="partial" disabled>Частично</button>
      <button type="button" class="button" data-rating="correct" disabled>Верно</button>
      <button type="button" class="button" data-rating="easy" disabled>Легко</button>
    </div>
    <button type="button" class="button quiz-skip" hidden>Пропустить</button>
    <p class="muted question-feedback" role="status"></p>
    <details class="question-answer-history" hidden>
      <summary>История ответов</summary>
      <ol reversed></ol>
      <button type="button" class="button quiz-history-more" hidden>Показать ещё</button>
    </details>
  </article>
</template>
{% include course-quiz-assets.html questions=include.questions %}
