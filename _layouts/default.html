<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}"></head>
<body>
<a class="skip-link" href="#main">К содержимому</a>
<header><div class="shell header-inner"><a class="brand" href="{{ '/' | relative_url }}"><span class="logo">{ }</span>.NET Courses</a>
<nav aria-label="Основная навигация">
<a href="{{ '/' | relative_url }}">Курсы</a>
<a href="{{ '/courses/whats-new/' | relative_url }}">Новое в .NET</a>
<a href="{{ '/courses/memory/' | relative_url }}">Память</a>
<a href="{{ '/about/' | relative_url }}">Как учиться</a>
</nav></div></header>
<main id="main" class="shell main">{{ content }}</main>
<footer><div class="shell">C#/.NET · Два практических курса · <a href="https://github.com/boyarincev/dotnet-courses">Исходники на GitHub</a></div></footer>
<script defer src="{{ '/assets/js/site.js' | relative_url }}"></script></body></html>
